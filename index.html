const PF_LABEL = {all:"全部",hermes:"Hermes",openclaw:"OpenClaw",claude:"Claude",codex:"Codex"};
let activePlatform = "all";
let activeCat = null;

function copyInstall(cmd, btn) {
  navigator.clipboard.writeText(cmd).then(() => {
    btn.textContent = '已复制';
    btn.classList.add('copied');
    setTimeout(() => { btn.textContent = '复制'; btn.classList.remove('copied'); }, 1500);
  }).catch(() => {
    const ta = document.createElement('textarea');
    ta.value = cmd; document.body.appendChild(ta);
    ta.select(); document.execCommand('copy');
    document.body.removeChild(ta);
    btn.textContent = '已复制'; btn.classList.add('copied');
    setTimeout(() => { btn.textContent = '复制'; btn.classList.remove('copied'); }, 1500);
  });
}

function render() {
  const el = document.getElementById('skillLibrary');
  el.innerHTML = '';
  const f = (document.getElementById('searchInput').value || '').toLowerCase();
  const groups = {};
  let total=0, owned=0;

  SKILLS.forEach(s => {
    const pfMatch = activePlatform === "all" || s.pf === activePlatform;
    const searchMatch = !f || s.cat.toLowerCase().includes(f) || s.name.toLowerCase().includes(f) || s.desc.toLowerCase().includes(f);
    const catMatch = !activeCat || s.cat === activeCat;
    if (!(pfMatch && searchMatch && catMatch)) return;
    if (!groups[s.cat]) groups[s.cat] = [];
    groups[s.cat].push(s);
    total++;
    if (s.owned) owned++;
  });

  document.getElementById('catCount').textContent = Object.keys(groups).length;
  document.getElementById('totalCount').textContent = total;
  document.getElementById('ownedCount').textContent = owned;
  document.getElementById('newCount').textContent = total - owned;

  Object.keys(groups).forEach(cat => {
    const sec = document.createElement('div');
    sec.className = 'cat-section';
    const head = document.createElement('div');
    head.className = 'cat-header';
    const h2 = document.createElement('h2');
    h2.textContent = cat;
    const badge = document.createElement('span');
    badge.className = 'cat-badge';
    const o = groups[cat].filter(s=>s.owned).length;
    const n = groups[cat].length - o;
    badge.innerHTML = '<span class="o">'+o+'</span>已装 <span class="n">'+n+'</span>未装 / 共'+groups[cat].length;
    head.appendChild(h2);
    head.appendChild(badge);
    sec.appendChild(head);

    const prog = document.createElement('div');
    prog.className = 'cat-progress';
    const pbar = document.createElement('div');
    pbar.className = 'cat-progress-bar';
    const pfill = document.createElement('div');
    pfill.className = 'cat-progress-fill';
    pfill.style.width = (o/groups[cat].length*100).toFixed(0)+'%';
    pbar.appendChild(pfill);
    const ptext = document.createElement('div');
    ptext.className = 'cat-progress-text';
    ptext.innerHTML = '<strong>'+o+'/'+groups[cat].length+'</strong> 完成 '+(o/groups[cat].length*100).toFixed(0)+'%';
    prog.appendChild(pbar);
    prog.appendChild(ptext);
    sec.appendChild(prog);

    const grid = document.createElement('div');
    grid.className = 'skill-grid';

    groups[cat].forEach(s => {
      const card = document.createElement('div');
      card.className = 'skill-card ' + (s.owned ? 'owned' : 'new') + (s.featured ? ' featured' : '');

      const name = document.createElement('div');
      name.className = 'skill-name';
      name.textContent = s.name;

      const pftag = document.createElement('span');
      pftag.className = 'pf-tag';
      pftag.dataset.p = s.pf;
      pftag.textContent = PF_LABEL[s.pf] || s.pf;
      name.appendChild(pftag);

      const desc = document.createElement('div');
      desc.className = 'skill-desc';
      desc.textContent = s.desc;

      const actions = document.createElement('div');
      actions.className = 'skill-actions';

      const inst = document.createElement('span');
      inst.className = 'skill-install';
      inst.textContent = s.install;

      const copybtn = document.createElement('span');
      copybtn.className = 'copy-btn';
      copybtn.textContent = '复制';
      copybtn.addEventListener('click', () => copyInstall(s.install, copybtn));

      const toktag = document.createElement('span');
      toktag.className = 'tok-tag';
      toktag.textContent = s.owned ? '已装' : '未装';

      actions.appendChild(inst);
      actions.appendChild(copybtn);
      actions.appendChild(toktag);

      card.appendChild(name);
      card.appendChild(desc);
      card.appendChild(actions);
      grid.appendChild(card);
    });

    sec.appendChild(grid);
    el.appendChild(sec);
  });

  if (total === 0) {
    el.innerHTML = '<p style="text-align:center;color:#484f58;padding:40px 0;font-size:0.9em">没有找到匹配的技能</p>';
  }
}

function buildCatNav() {
  const nav = document.getElementById('catNav');
  nav.innerHTML = '';

  const allTotal = SKILLS.length;
  const allOwned = SKILLS.filter(s=>s.owned).length;
  const allItem = document.createElement('div');
  allItem.className = 'nav-item' + (activeCat === null ? ' active' : '');
  allItem.innerHTML = '<span>全部 ('+allTotal+')</span><span class="count">'+allOwned+'/'+allTotal+'</span>';
  const allProg = document.createElement('div');
  allProg.className = 'progress-bar';
  const allFill = document.createElement('div');
  allFill.className = 'progress-fill';
  allFill.style.width = (allOwned/allTotal*100).toFixed(0)+'%';
  allProg.appendChild(allFill);
  allItem.appendChild(allProg);
  allItem.addEventListener('click', () => {
    activeCat = null;
    document.querySelectorAll('#catNav .nav-item').forEach(el => el.classList.remove('active'));
    allItem.classList.add('active');
    render();
  });
  nav.appendChild(allItem);

  const counts = {};
  SKILLS.forEach(s => {
    if (!counts[s.cat]) counts[s.cat] = {total:0,owned:0};
    counts[s.cat].total++;
    if (s.owned) counts[s.cat].owned++;
  });
  Object.keys(counts).forEach(cat => {
    const c = counts[cat];
    const item = document.createElement('div');
    item.className = 'nav-item' + (activeCat === cat ? ' active' : '');
    item.innerHTML = '<span>'+cat+' ('+c.total+')</span><span class="count">'+c.owned+'/'+c.total+'</span>';
    const prog = document.createElement('div');
    prog.className = 'progress-bar';
    const fill = document.createElement('div');
    fill.className = 'progress-fill';
    fill.style.width = (c.owned/c.total*100).toFixed(0)+'%';
    prog.appendChild(fill);
    item.appendChild(prog);
    item.addEventListener('click', () => {
      activeCat = activeCat === cat ? null : cat;
      document.querySelectorAll('#catNav .nav-item').forEach(el => el.classList.remove('active'));
      if (activeCat) item.classList.add('active');
      render();
    });
    nav.appendChild(item);
  });
}

document.querySelectorAll('#platformTabs .platform-tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('#platformTabs .platform-tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    activePlatform = tab.dataset.p;
    render();
  });
});

document.getElementById('searchInput').addEventListener('input', () => render());

buildCatNav();
render();
</script>
