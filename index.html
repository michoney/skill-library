<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI','Microsoft YaHei',sans-serif;background:#0d1117;color:#e6edf3;padding:0;min-height:100vh}
.header{background:#161b22;border-bottom:1px solid #30363d;padding:14px 24px;display:flex;align-items:center;gap:20px}
.logo{font-size:1.3em;font-weight:700;color:#58a6ff;white-space:nowrap}
.logo span{color:#bc8cff}
.search-bar{flex:1;position:relative;max-width:600px}
.search-bar input{width:100%;padding:10px 16px;border-radius:20px;border:1px solid #30363d;background:#0d1117;color:#e6edf3;font-size:0.9em;outline:none}
.search-bar input:focus{border-color:#58a6ff}
.search-bar input::placeholder{color:#484f58}
.header-right{display:flex;gap:8px;margin-left:auto}
.header-btn{padding:8px 16px;border-radius:16px;font-size:0.82em;cursor:pointer;border:1px solid #30363d;background:#161b22;color:#c9d1d9;transition:all .15s;white-space:nowrap}
.header-btn:hover{border-color:#58a6ff;color:#58a6ff}
.header-btn.active{background:#1f6feb;border-color:#1f6feb;color:#fff}
.main{padding:20px 24px;max-width:1400px;margin:0 auto}
.sort-bar{display:flex;align-items:center;gap:12px;margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid #21262d}
.sort-label{font-size:0.8em;color:#8b949e}
.sort-select{padding:5px 12px;border-radius:14px;background:#161b22;border:1px solid #30363d;color:#c9d1d9;font-size:0.8em;cursor:pointer}
.stats-inline{margin-left:auto;font-size:0.8em;color:#8b949e}
.stats-inline strong{color:#58a6ff}
.skill-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px}
.skill-card{background:#161b22;border:1px solid #30363d;border-radius:8px;overflow:hidden;transition:all .2s;cursor:pointer;position:relative}
.skill-card:hover{border-color:#58a6ff;transform:translateY(-2px);box-shadow:0 4px 12px #00000040}
.card-img{height:100px;display:flex;align-items:center;justify-content:center;font-size:2.5em;background:linear-gradient(135deg,#1f6feb22,#bc8cff22);border-bottom:1px solid #30363d}
.card-body{padding:10px 12px}
.card-title{font-size:0.82em;font-weight:600;color:#e6edf3;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-author{font-size:0.72em;color:#8b949e;margin-bottom:6px}
.card-tags{display:flex;flex-wrap:wrap;gap:3px;margin-bottom:6px}
.card-tag{padding:1px 6px;border-radius:8px;font-size:0.62em;font-weight:600}
.card-tag.owned{background:#3fb95033;color:#3fb950}
.card-tag.new{background:#f0883e33;color:#f0883e}
.card-tag.featured{background:#f0c75e33;color:#f0c75e}
.card-tag.pf-tag{background:#58a6ff22;color:#58a6ff}
.card-desc{font-size:0.68em;color:#8b949e;line-height:1.35;margin-bottom:6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card-install{font-size:0.62em;color:#484f58;display:flex;align-items:center;gap:3px}
.card-install .copy-btn{cursor:pointer;color:#58a6ff;background:none;border:none;font-size:0.9em;padding:1px 4px;border-radius:4px}
.card-install .copy-btn:hover{background:#1f6feb33}
.card-install .copy-btn.copied{color:#3fb950}
.progress-overlay{position:absolute;top:0;left:0;height:3px;background:linear-gradient(90deg,#3fb950,#58a6ff);border-radius:0 8px 0 0}
.cat-filter{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.cat-btn{padding:5px 12px;border-radius:14px;font-size:0.76em;cursor:pointer;border:1px solid #30363d;background:#161b22;color:#c9d1d9;transition:all .15s}
.cat-btn:hover{border-color:#58a6ff;color:#58a6ff}
.cat-btn.active{background:#1f6feb;border-color:#1f6feb;color:#fff}
.footer{text-align:center;margin-top:24px;padding:16px;color:#484f58;font-size:0.72em;border-top:1px solid #21262d}
.footer a{color:#58a6ff;text-decoration:none}

const PF_LABEL = {all:"全部",hermes:"Hermes",openclaw:"OpenClaw",claude:"Claude",codex:"Codex"};
let activeSort = "all";
let activeCat = null;
let activeSearch = "";
let sortType = "default";

function copyInstall(cmd, btn) {
  navigator.clipboard.writeText(cmd).then(() => {
    btn.textContent = "✓"; btn.classList.add("copied");
    setTimeout(() => { btn.textContent = "📋"; btn.classList.remove("copied"); }, 1500);
  }).catch(() => {
    const ta = document.createElement("textarea");
    ta.value = cmd; document.body.appendChild(ta);
    ta.select(); document.execCommand("copy");
    document.body.removeChild(ta);
    btn.textContent = "✓"; btn.classList.add("copied");
    setTimeout(() => { btn.textContent = "📋"; btn.classList.remove("copied"); }, 1500);
  });
}

function render() {
  const grid = document.getElementById("skillGrid");
  grid.innerHTML = "";
  const f = (document.getElementById("searchInput").value || "").toLowerCase();
  let list = SKILLS.filter(s => {
    if (activeSort === "owned" && !s.owned) return false;
    if (activeSort === "new" && s.owned) return false;
    if (activeSort === "featured" && !s.featured) return false;
    if (activeCat && s.cat !== activeCat) return false;
    if (f && !s.cat.toLowerCase().includes(f) && !s.name.toLowerCase().includes(f) && !s.desc.toLowerCase().includes(f) && !s.icon.includes(f)) return false;
    return true;
  });
  if (sortType === "name") list.sort((a,b) => a.name.localeCompare(b.name));
  if (sortType === "name-desc") list.sort((a,b) => b.name.localeCompare(a.name));

  const allTotal = SKILLS.length;
  const allOwned = SKILLS.filter(s=>s.owned).length;
  document.getElementById("totalCount").textContent = allTotal;
  document.getElementById("ownedCount").textContent = allOwned;
  document.getElementById("newCount").textContent = allTotal - allOwned;

  list.forEach(s => {
    const card = document.createElement("div");
    card.className = "skill-card";
    card.style.cursor = "pointer";

    const progress = document.createElement("div");
    progress.className = "progress-overlay";
    progress.style.width = s.owned ? "100%" : "0%";
    card.appendChild(progress);

    const img = document.createElement("div");
    img.className = "card-img";
    img.textContent = s.icon;
    card.appendChild(img);

    const body = document.createElement("div");
    body.className = "card-body";

    const title = document.createElement("div");
    title.className = "card-title";
    title.textContent = s.name;
    body.appendChild(title);

    const author = document.createElement("div");
    author.className = "card-author";
    author.textContent = PF_LABEL[s.pf] || s.pf;
    body.appendChild(author);

    const tags = document.createElement("div");
    tags.className = "card-tags";

    const ownedTag = document.createElement("span");
    ownedTag.className = "card-tag " + (s.owned ? "owned" : "new");
    ownedTag.textContent = s.owned ? "已装" : "未装";
    tags.appendChild(ownedTag);

    if (s.featured) {
      const ftag = document.createElement("span");
      ftag.className = "card-tag featured";
      ftag.textContent = "推荐";
      tags.appendChild(ftag);
    }

    const pftag = document.createElement("span");
    pftag.className = "card-tag pf-tag";
    pftag.textContent = PF_LABEL[s.pf] || s.pf;
    tags.appendChild(pftag);

    body.appendChild(tags);

    const desc = document.createElement("div");
    desc.className = "card-desc";
    desc.textContent = s.desc;
    body.appendChild(desc);

    const install = document.createElement("div");
    install.className = "card-install";
    install.textContent = s.install;

    const copybtn = document.createElement("span");
    copybtn.className = "copy-btn";
    copybtn.textContent = "📋";
    copybtn.addEventListener("click", (e) => { e.stopPropagation(); copyInstall(s.install, copybtn); });
    install.appendChild(copybtn);

    body.appendChild(install);
    card.appendChild(body);
    grid.appendChild(card);
  });

  if (list.length === 0) {
    grid.innerHTML = '<p style="text-align:center;color:#484f58;padding:40px 0;font-size:0.9em">没有找到匹配的技能</p>';
  }
}

  cf.innerHTML = "";
  const counts = {};
  SKILLS.forEach(s => { if (!counts[s.cat]) counts[s.cat] = 0; counts[s.cat]++; });

  const allBtn = document.createElement("button");
  allBtn.className = "cat-btn" + (activeCat === null ? " active" : "");
  allBtn.textContent = "全部 (" + SKILLS.length + ")";
  allBtn.addEventListener("click", () => { activeCat = null; buildCatFilter(); render(); });
  cf.appendChild(allBtn);

  Object.keys(counts).forEach(cat => {
    const btn = document.createElement("button");
    btn.className = "cat-btn" + (activeCat === cat ? " active" : "");
    btn.textContent = cat + " (" + counts[cat] + ")";
    btn.addEventListener("click", () => { activeCat = activeCat === cat ? null : cat; buildCatFilter(); render(); });
    cf.appendChild(btn);
  });
}

document.querySelectorAll(".header-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".header-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    activeSort = btn.dataset.sort;
    render();
  });
});

document.getElementById("searchInput").addEventListener("input", () => render());
document.getElementById("sortSelect").addEventListener("change", (e) => { sortType = e.target.value; render(); });

buildCatFilter();
render();
</script>
</body>
</html>
